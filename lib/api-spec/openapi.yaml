        color:
          type: string
        quantity:
          type: integer

    InventoryTransaction:
      type: object
      required: [id, date, type, productId, productName, quantity, reference, referenceType, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
        type:
          type: string
          enum: [in, out]
        productId:
          type: integer
        productName:
          type: string
        quantity:
          type: integer
        reference:
          type: string
        referenceType:
          type: string
          enum: [purchase, sale]
        createdAt:
          type: string

    # ---- EXPENSE ----
    Expense:
      type: object
      required: [id, date, category, description, amount, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
        category:
          type: string
        description:
          type: string
        amount:
          type: number
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    ExpenseInput:
      type: object
      required: [date, category, description, amount]
      properties:
        date:
          type: string
        category:
          type: string
        description:
          type: string
        amount:
          type: number
        notes:
          type: string

    ExpenseUpdate:
      type: object
      properties:
        date:
          type: string
        category:
          type: string
        description:
          type: string
        amount:
          type: number
        notes:
          type: string

    # ---- TREASURY ----
    TreasuryBalance:
      type: object
      required: [balance, totalIn, totalOut]
      properties:
        balance:
          type: number
        totalIn:
          type: number
        totalOut:
          type: number

    TreasuryTransaction:
      type: object
      required: [id, date, type, amount, description, source, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
        type:
          type: string
          enum: [in, out]
        amount:
          type: number
        description:
          type: string
        source:
          type: string
          enum: [sale, expense, purchase, manual]
        reference:
          type: ["string", "null"]
        createdAt:
          type: string

    TreasuryTransactionInput:
      type: object
      required: [date, type, amount, description]
      properties:
        date:
          type: string
        type:
          type: string
          enum: [in, out]
        amount:
          type: number
        description:
          type: string
        notes:
          type: string

    # ---- REPORTS ----
    DashboardData:
      type: object
      required: [totalSalesAmount, totalPurchasesAmount, totalExpenses, netProfit, cashBalance, totalCustomers, totalReps, inventoryItems, recentSales, recentPurchases, monthlySales, topReps]
      properties:
        totalSalesAmount:
